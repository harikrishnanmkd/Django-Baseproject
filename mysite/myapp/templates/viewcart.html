<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
        background-image: linear-gradient(to top, #fbc2eb 0%, #a6c1ee 100%);
        }
        table{
            margin-top: 120px;
            border-collapse: collapse;
            width: 300px;
            

        
        }
      
        button{
            background-color: green;
        }
        button a{
            text-decoration: none;
            color: white;

            
        }
        a{
            text-decoration: none;
            color: white;
        }
   
        
    </style>
</head>
<body>
    <center>
        <h1 style="color: blue;">MY CART</h1>
        <table border="5">
            <tr>
                <th>Book</th>
                <th>Price</th>
                <th>Quantity</th>
                
            </tr>
            {% for i in cart %}
            <tr>
                <td>{{i.book.title}}</td>
                <td>{{i.book.price}}</td>
                <td>{{i.quantity}}</td>
                <td><form action="{% url 'deletecart' i.id %}" method="POST">
                {% csrf_token %}
                <button type="submit" style="background:none; border:none; color:red;">
                🗑 </button>
                </form></td>
            </tr>
            {% endfor %}
            <tr>
                <td></td>
                <td colspan="3">Total Price={{total_price}}</td>
                
            </tr>
        </table><br><br>
        <button><a href="{% url 'viewbook' %}">View Book</a></button>
        <form action="{% url 'clearcart' %}" method="POST" style="display: inline;"
                onsubmit="return confirm('Are you sure you want to clear cart?');">
                {% csrf_token %}
                <button type="submit" style="background:red; color:white;">
                 Clear Cart</button>
                </form>




    </center>
    
</body>
</html>
